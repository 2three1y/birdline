<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' wss: https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Birdline</title>
<meta name="description" content="Birdline: short Tweets from the people you follow, in order, with the classic timeline look. No algorithm, no ads, no AI. Runs on Nostr, so nobody owns it.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18212a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Birdline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css?v=0.2.0">
<link rel="stylesheet" href="css/app.css?v=0.2.0">
<script type="module" src="js/app.js?v=0.2.0"></script>
</head>
<body>
<a class="skip-link" href="#main" id="skip-link">Skip to main content</a>
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
      <ul>
        <li><a href="#/home" id="tab-home"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M2.5 8.5 10 2.5l7.5 6M4.5 7v10h4v-5h3v5h4V7"/></svg><span class="tab-label">Home</span></a></li>
        <li><a href="#/connect" id="tab-connect"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 2h-13zM8 17.5a2 2 0 0 0 4 0"/></svg><span class="tab-label">Notifications</span><span class="badge" id="badge-connect" hidden></span></a></li>
        <li><a href="#/messages" id="tab-messages"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M2.5 5h15v10h-15zM2.5 5.5 10 11l7.5-5.5"/></svg><span class="tab-label">Messages</span><span class="badge" id="badge-messages" hidden></span></a></li>
        <li><a href="#/discover" id="tab-discover"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8 3 6.5 17M13.5 3 12 17M3.5 7.5h14M2.5 12.5h14"/></svg><span class="tab-label">Discover</span></a></li>
        <li><a href="#/me" id="tab-me"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 17.5c.8-3.4 3.6-5 7-5s6.2 1.6 7 5"/></svg><span class="tab-label">Me</span></a></li>
      </ul>
    </nav>
    <a class="brand" href="#/home" id="brand-link"><img src="icons/icon.svg" alt="" width="26" height="26"><span class="brand-name">Birdline</span></a>
    <div class="topbar-tools" id="topbar-tools" hidden>
      <form class="topbar-search" id="topbar-search" role="search" novalidate>
        <label for="topbar-search-input" class="visually-hidden">Search Birdline, or go to a @username or npub</label>
        <input type="search" id="topbar-search-input" placeholder="Search Birdline" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
        <button type="submit" class="search-go" id="topbar-search-go"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8.5 14a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM12.5 12.5l5 5"/></svg><span class="visually-hidden">Search</span></button>
      </form>
      <div class="menu-wrap avatar-wrap">
        <button type="button" class="avatar-btn" id="topbar-avatar" aria-expanded="false" aria-controls="avatar-menu"><span id="topbar-avatar-pic" class="avatar-pic"></span><span class="visually-hidden">Account menu</span></button>
        <ul class="menu avatar-menu" id="avatar-menu" hidden>
          <li class="menu-name" id="avatar-menu-name"></li>
          <li><a class="menu-item" href="#/me" id="menu-profile">View profile</a></li>
          <li><a class="menu-item" href="#/settings" id="menu-settings">Settings</a></li>
          <li><button type="button" class="menu-item" id="menu-signout">Sign out</button></li>
        </ul>
      </div>
      <button type="button" class="btn primary compose-btn" id="topbar-compose"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M16.5 2.5c-6 1-9.5 5-11 10.5M5.5 13 4 17.5M8 11l3-.5c3-1 5-4 5.5-8"/></svg><span class="visually-hidden">New </span><span class="compose-btn-label">Tweet</span></button>
    </div>
    <span class="topbar-user" id="topbar-user"></span>
  </div>
</header>
<main id="main" tabindex="-1">
  <h1 id="view-title" tabindex="-1">Birdline</h1>
  <div id="view"><p>Loading Birdline…</p><noscript><p>Birdline needs JavaScript turned on.</p></noscript></div>
</main>
<footer class="site-footer" id="site-footer"><p>Co-written with Tab</p></footer>
<div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
